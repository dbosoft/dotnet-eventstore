# CI for the NuGet packages: version with GitVersion, build, test, pack and push to the project feed.
# Runs on main and on release tags (v*). Every green main build publishes a CI-versioned package.
trigger:
  branches:
    include:
      - main
      - refs/tags/v*

# Linux: the provider conformance tests spin up SQL Server, PostgreSQL and Azurite as Docker
# containers (Testcontainers), which run natively on a hosted Ubuntu agent.
pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'
  solution: 'Dbosoft.EventStore.slnx'

steps:
- checkout: self
  fetchDepth: 0          # GitVersion needs the full history
  clean: true

- task: UseDotNet@2
  displayName: Install .NET SDK
  inputs:
    packageType: sdk
    version: '10.0.x'

- task: gitversion/setup@3.1.11
  displayName: Install GitVersion
  inputs:
    versionSpec: '5.11.x'

- task: gitversion/execute@3.1.11
  displayName: Execute GitVersion

- task: DotNetCoreCLI@2
  displayName: dotnet build
  inputs:
    command: build
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) -p:Version=$(GitVersion.NuGetVersion)'

- task: DotNetCoreCLI@2
  displayName: dotnet test
  inputs:
    command: test
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-build --collect "XPlat Code Coverage"'
    publishTestResults: true

- task: reportgenerator@5
  displayName: Merge code coverage results
  inputs:
    reports: '$(Agent.WorkFolder)/**/coverage.cobertura.xml'
    targetdir: '$(Build.SourcesDirectory)/CoverageResults'
    reporttypes: 'Cobertura'

- task: PublishCodeCoverageResults@2
  displayName: Publish code coverage report
  inputs:
    summaryFileLocation: '$(Build.SourcesDirectory)/CoverageResults/Cobertura.xml'

- task: DotNetCoreCLI@2
  displayName: dotnet pack
  inputs:
    command: pack
    packagesToPack: '$(solution)'
    nobuild: true
    configuration: '$(buildConfiguration)'
    packDirectory: '$(Build.ArtifactStagingDirectory)'
    buildProperties: 'Version=$(GitVersion.NuGetVersion)'

- task: PublishBuildArtifacts@1
  displayName: Publish package artifacts
  inputs:
    ArtifactName: build-packages

- task: NuGetCommand@2
  displayName: Publish to project nuget feed
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg'
    nuGetFeedType: 'internal'
    publishVstsFeed: '59a3608a-9bed-4cb4-9467-6efaaa3cbef5/1e425ef4-e3a0-4927-b4c0-2beff753cb88'
    allowPackageConflicts: true
