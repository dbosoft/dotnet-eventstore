# CI for the NuGet packages: version with GitVersion, build, test, pack and push to the project feed.
# Runs on main and on release tags (v*). Every green main build publishes a CI-versioned package.
trigger:
  branches:
    include:
      - main
      - refs/tags/v*

# Linux: the provider conformance tests spin up SQL Server, PostgreSQL and Azurite as Docker
# containers (Testcontainers), which run natively on a hosted Ubuntu agent.
pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'
  solution: 'Dbosoft.EventStore.slnx'
  # A tag build checks out a detached HEAD; GitVersion 6 must be bypassed there (see below).
  isTagBuild: $[ startsWith(variables['Build.SourceBranch'], 'refs/tags/v') ]

steps:
- checkout: self
  fetchDepth: 0          # GitVersion needs the full history
  clean: true

- task: UseDotNet@2
  displayName: Install .NET SDK
  inputs:
    packageType: sdk
    version: '10.0.x'

# Versioning follows the GitHub-flow release model on GitVersion 6:
#  - branch (CI) builds  -> GitVersion computes X.Y.Z-ci.<n> (main is labelled 'ci' in gitversion.yml)
#  - tag builds (v*)      -> GitVersion is bypassed and the version is taken verbatim from the tag name.
# The tag bypass is required: on a detached-HEAD tag build GitVersion 6 relabels a pre-release tag to the
# branch's 'ci' label (v0.15.0-beta.1 -> 0.15.0-ci.1) or falls back to '-no-branch-' (GitVersion #4534).
- task: gitversion/setup@3
  displayName: Install GitVersion
  condition: ne(variables['isTagBuild'], 'True')
  inputs:
    versionSpec: '6.7.x'

- task: gitversion/execute@3
  displayName: Execute GitVersion
  condition: ne(variables['isTagBuild'], 'True')
  inputs:
    configFilePath: 'gitversion.yml'

- pwsh: |
    $v = '$(GitVersion.SemVer)'
    Write-Host "Package version (branch build): $v"
    Write-Host "##vso[task.setvariable variable=packageVersion]$v"
    Write-Host "##vso[build.updatebuildnumber]$v"
  displayName: Resolve version from GitVersion
  condition: ne(variables['isTagBuild'], 'True')

- pwsh: |
    $v = "$env:BUILD_SOURCEBRANCH" -replace '^refs/tags/v', ''
    Write-Host "Package version (tag build): $v"
    Write-Host "##vso[task.setvariable variable=packageVersion]$v"
    Write-Host "##vso[build.updatebuildnumber]$v"
  displayName: Resolve version from tag
  condition: eq(variables['isTagBuild'], 'True')

- task: DotNetCoreCLI@2
  displayName: dotnet build
  inputs:
    command: build
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) -p:Version=$(packageVersion)'

- task: DotNetCoreCLI@2
  displayName: dotnet test
  inputs:
    command: test
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-build --collect "XPlat Code Coverage"'
    publishTestResults: true

- task: reportgenerator@5
  displayName: Merge code coverage results
  inputs:
    reports: '$(Agent.WorkFolder)/**/coverage.cobertura.xml'
    targetdir: '$(Build.SourcesDirectory)/CoverageResults'
    reporttypes: 'Cobertura'

- task: PublishCodeCoverageResults@2
  displayName: Publish code coverage report
  inputs:
    summaryFileLocation: '$(Build.SourcesDirectory)/CoverageResults/Cobertura.xml'

- task: DotNetCoreCLI@2
  displayName: dotnet pack
  inputs:
    command: pack
    packagesToPack: '$(solution)'
    nobuild: true
    configuration: '$(buildConfiguration)'
    packDirectory: '$(Build.ArtifactStagingDirectory)'
    buildProperties: 'Version=$(packageVersion)'

- task: PublishBuildArtifacts@1
  displayName: Publish package artifacts
  inputs:
    ArtifactName: build-packages

# dotnet-based push (not NuGetCommand@2, whose NuGet.exe needs mono — absent on Ubuntu 24.04+).
- task: DotNetCoreCLI@2
  displayName: Publish to project nuget feed
  inputs:
    command: push
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg'
    nuGetFeedType: internal
    publishVstsFeed: '59a3608a-9bed-4cb4-9467-6efaaa3cbef5/1e425ef4-e3a0-4927-b4c0-2beff753cb88'
